# RunWild configuration.
# See runwild.properties.example for what every setting does.

location.name      = Grand Junction, CO
location.latitude  = 39.0639
location.longitude = -108.5506

# "Feels like" band, in °F.
ideal.temp.min.f   = 40
ideal.temp.max.f   = 65

# Upstream pollen coverage is Europe-only, so at this location pollen is reported
# as unavailable and ground-level ozone is scored instead.
pollen.sensitivity = 1.0

run.duration.hours = 1
forecast.days      = 2
avoid.darkness     = true
